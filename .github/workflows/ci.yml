name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  audit:
    # Reported, not required: advisories appear without notice and should not block unrelated PRs.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod

  # Browser tests. A pull request runs the quick smoke subset (one or two tests per surface, see docs/testing.md);
  # main runs everything. Neither is a required check: software WebGL on 2 shared cores is the likeliest to flake.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Smoke e2e (pull request)
        if: github.event_name == 'pull_request'
        run: pnpm test:e2e:smoke
      - name: Full e2e (main)
        if: github.event_name != 'pull_request'
        run: pnpm test:e2e
      - name: Keep screenshots and console logs of failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures
          path: packages/e2e/artifacts
          if-no-files-found: ignore
          retention-days: 14

  # The Python client (ADR-0016): unit tests against a fake hub, then the same client against a real `vikaki serve --tts fake`.
  python-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Unit tests (fake hub)
        working-directory: clients/python
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/pytest -q
      - name: Integration tests (real hub, fake voice)
        working-directory: clients/python
        run: |
          pnpm --dir ../.. serve --port 8787 --tts fake > hub.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8787/avatar && break; sleep 1; done
          VIKAKI_HUB_URL=ws://127.0.0.1:8787/ws .venv/bin/pytest -q -m integration || { cat hub.log; exit 1; }
