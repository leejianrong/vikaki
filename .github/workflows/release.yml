name: Release

# On a version tag (vX.Y.Z, or vX.Y.Z-rc.N) this publishes the image to GHCR (VIK-124, ADR-0046, docs/release.md). Nothing is published
# from a pull request, a branch or a manual run: those only build and smoke-test the image (a dry run), so this file is exercised before a
# real tag is. The tag decides everything: scripts/release-plan.mjs turns it into the image tags and checks the Python client's version.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release-plan.mjs
      - Dockerfile
  workflow_dispatch:
    inputs:
      tag:
        description: A tag-shaped name to dry-run, such as v0.1.0. Nothing is pushed.
        default: v0.1.0

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Third-party actions below are pinned to a commit (the version is in the comment): a release pipeline should not move under us.

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      image: ${{ steps.plan.outputs.image }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      python_version: ${{ steps.plan.outputs.python_version }}
      image_tags: ${{ steps.plan.outputs.image_tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: mode
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; else echo "publish=false" >> "$GITHUB_OUTPUT"; fi
      - name: A release tag must be on main
        if: steps.mode.outputs.publish == 'true'
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not a commit of main: tag a merged commit"; exit 1; }
      - name: A release needs its notes
        if: steps.mode.outputs.publish == 'true'
        run: test -f "docs/releases/$GITHUB_REF_NAME.md" || { echo "::error::write docs/releases/$GITHUB_REF_NAME.md (the release notes) and merge it before tagging"; exit 1; }
      - id: plan
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag || 'v0.1.0' }}
          OWNER: ${{ github.repository_owner }}
          # Only a real tag has to agree with the Python client's version: a dry run's stand-in tag need not.
          CHECK: ${{ steps.mode.outputs.publish == 'true' && 'yes' || '' }}
        run: node scripts/release-plan.mjs "$TAG" --owner "$OWNER" ${CHECK:+--check} --github-output

  image:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for amd64 and start it, before anything is pushed
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: vikaki
          platforms: linux/amd64
          load: true
          tags: vikaki:smoke
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
      - name: The image serves the avatar page
        run: |
          id=$(docker run -d -p 127.0.0.1:8787:8787 vikaki:smoke)
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$id")" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' "$id" | grep -qx healthy || { docker logs "$id"; exit 1; }
          curl -fsS http://127.0.0.1:8787/avatar/ | grep -qi "<html" || { echo "::error::the avatar page was not served"; exit 1; }
          docker rm -f "$id"
      - name: Log in to GHCR
        if: needs.plan.outputs.publish == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for amd64 and arm64, and push only on a version tag
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: vikaki
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.plan.outputs.publish == 'true' }}
          tags: ${{ needs.plan.outputs.image_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
      - name: What was pushed
        if: needs.plan.outputs.publish == 'true'
        run: |
          echo "Published ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '${{ needs.plan.outputs.image_tags }}' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

  # Sign the pushed image and attach an SBOM (VIK-133). Keyless: the signature is made with this workflow's own identity (GitHub's OIDC
  # token), so there is no key to keep or leak, and it is recorded in the public Rekor log. The SBOM (SPDX, from syft) is also signed onto the image
  # as an attestation and kept as a file for the GitHub release.
  sign:
    needs: [plan, image]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ${{ needs.plan.outputs.image }}
      VERSION: ${{ needs.plan.outputs.version }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: An SBOM of the image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ env.DIGEST }}
          format: spdx-json
          output-file: vikaki-${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Sign the image and attach its SBOM as a signed attestation
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type spdxjson --predicate "vikaki-$VERSION.spdx.json" "$IMAGE@$DIGEST"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: "*.spdx.json"
          if-no-files-found: error

  # The Python client (VIK-129): the same version as the image, built on every run (a dry run too) and checked by installing the wheel into a clean
  # environment. On a tag it is attached to the GitHub release; the `pypi` job below publishes it to PyPI only when the project has opted in.
  python:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build the wheel and the source distribution
        working-directory: clients/python
        run: uv build
      - name: The wheel installs on its own, says the planned version, and carries the protocol schema
        env:
          PUBLISH: ${{ needs.plan.outputs.publish }}
          PLANNED: ${{ needs.plan.outputs.python_version }}
        run: |
          # A dry run uses a stand-in tag, so it compares with pyproject.toml; a real tag must equal the plan (the plan job already checked pyproject).
          want="$PLANNED"
          if [ "$PUBLISH" != true ]; then want=$(node -e 'import("./scripts/release-plan.mjs").then((m) => console.log(m.pyprojectVersion(require("fs").readFileSync("clients/python/pyproject.toml", "utf8"))))'); fi
          uv venv "$RUNNER_TEMP/clean"
          uv pip install --python "$RUNNER_TEMP/clean/bin/python" clients/python/dist/*.whl
          "$RUNNER_TEMP/clean/bin/python" -I -c "import sys, vikaki_client as v; want, = sys.argv[1:]; assert v.__version__ == want, (v.__version__, want); v.validate(v.make('hello', role='viewer')); print('vikaki-client', v.__version__, 'speaks protocol', v.PROTOCOL_VERSION)" "$want"
          ls clients/python/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: clients/python/dist/*
          if-no-files-found: error

  # The GitHub release (VIK-125): the notes file, and the SBOMs. Runs only on a tag, after the images are signed.
  github-release:
    needs: [plan, sign, python]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          args=(--verify-tag --title "Vikaki $VERSION" --notes-file "docs/releases/$TAG.md")
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          mapfile -t files < <(find dist -type f | sort)
          printf 'attaching %s\n' "${files[@]}"
          gh release create "$TAG" "${args[@]}" "${files[@]}"

  # PyPI (VIK-129), after the release exists, because a PyPI upload cannot be taken back. Off until the project opts in: set the repository variable
  # PUBLISH_TO_PYPI to true after adding this repository and workflow as a trusted publisher of `vikaki-client` on PyPI (docs/release.md). No token is stored.
  pypi:
    needs: [plan, python, github-release]
    if: needs.plan.outputs.publish == 'true' && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
