[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vikaki-poker"
version = "0.1.0"
description = "A Texas Hold'em engine and LLM seats for the Vikaki example table (ADR-0018)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# pyyaml: MIT (checked 2026-10-14). Reads the table file and the personas file for each character's style.
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Speaking at a real hub also needs vikaki-client (ADR-0016). It is not on PyPI yet, so it is not listed here: see the README.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vikaki_poker = ["data/*.json"]  # the solved push/fold charts and the class-against-class equities (VIK-123)

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running `vikaki serve --personas personas.table.example.yaml` (set VIKAKI_HUB_URL)"]
