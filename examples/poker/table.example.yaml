# The example poker table (ADR-0018): who sits where and which model plays each seat.
# Run a hub with the matching personas first:  pnpm serve --port 8787 --personas personas.table.example.yaml
# Then:  python -m vikaki_poker play --table examples/poker/table.example.yaml
# Watch at http://127.0.0.1:8787/avatar?seats=3

personas_file: ../../personas.table.example.yaml   # the characters' looks, voices and `style` notes; relative to this file
stack: 200                                         # chips each seat starts with
small_blind: 1
big_blind: 2
max_tokens: 300                                    # cap on a model's reply per move
# reaction_model: deepseek/deepseek-v4.1-flash           # optional, a cheap model for how listeners react silently to a line; without it they follow a fixed table

# How each seat talks, each from 0 to 1 (0.5 is middling): talkative (how much it says), emotional (how much it shows), loose, aggressive and tricky
# (how it talks about the game), and a free-text quirk. Everyone plays the same sound game; the traits never change what a seat does (VIK-112,
# examples/poker/README.md, ADR-0022). Archetypes, not impersonations: the showman who narrates, the careful rock who apologises, the fearless gambler.
seats:
  seat-1:
    persona: ada
    model: deepseek/deepseek-v4.1-flash   # an OpenRouter model id (checked against the public model list, 2026-10-18). A thinking model: reasoning is off unless you pass --reasoning
    traits: {talkative: 0.9, loose: 0.7, aggressive: 0.75, bluff: 0.6, tricky: 0.5, emotional: 0.8, quirk: "narrates her own plays like a sports commentator and teases the others by name"}
  seat-2:
    persona: ben
    model: deepseek/deepseek-v4.1-flash
    traits: {talkative: 0.45, loose: 0.15, aggressive: 0.25, bluff: 0.1, tricky: 0.7, emotional: 0.7, quirk: "apologises politely before taking a pot, and sounds worried even when winning"}
  seat-3:
    persona: cy
    model: deepseek/deepseek-v4.1-flash
    traits: {talkative: 0.6, loose: 0.95, aggressive: 0.95, bluff: 0.85, tricky: 0.6, emotional: 0.35, quirk: "grins, brags about gambles and big moves, and never explains a bluff"}
