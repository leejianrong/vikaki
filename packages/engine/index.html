<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>vikaki avatar</title>
    <style>
      html, body { margin: 0; height: 100%; background: #101418; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud { position: fixed; left: 8px; bottom: 8px; color: #8aa; font: 12px monospace; }
      #hud[hidden] { display: none; }
      /* embed mode (VIK-64): see through, and no colour scheme of its own, or an iframe in a page of the other scheme gets an opaque backdrop */
      html.embed { color-scheme: normal; }
      html.embed, html.embed body { background: transparent; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="hud">vikaki</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
